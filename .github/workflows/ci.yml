name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-check-and-test:
    name: App contract and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/api/package-lock.json
      - name: Install API dependencies
        run: npm ci --prefix app/api --no-audit --no-fund
      - name: Check FE/API synchronization
        run: npm run check --prefix app
      - name: Run API test suite
        run: npm test --prefix app/api

  sql-parse:
    name: SQL structure and T-SQL parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLFluff parser
        run: python -m pip install --disable-pip-version-check -r tools/requirements-sql-check.txt
      - name: Check SQL batches and parse T-SQL
        run: node tools/check-sql.js --require-parser
